name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          $files = @(
            'main.js', 'projectStarter.js', 'processManager.js',
            'restartPolicy.js', 'preload.js', 'renderer.js',
            'test/processManager.test.js', 'test/projectStarter.test.js',
            'test/restartPolicy.test.js', 'test/repository-readiness.test.js'
          )
          foreach ($file in $files) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
