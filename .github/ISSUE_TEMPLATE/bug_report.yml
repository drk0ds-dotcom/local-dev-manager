name: Bug report
description: Report a reproducible problem with Local Dev Manager
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, follow SECURITY.md instead. Remove secrets and personal paths before posting logs."
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and package manager
      placeholder: "Windows 11 x64; npm 11"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots (optional)
