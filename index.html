<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<title>Local Dev Manager</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Tajawal:wght@400;500;700&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-deep:    #090b10;
  --bg-panel:   #0f1117;
  --bg-card:    #141720;
  --bg-hover:   #1a1e2a;
  --border:     rgba(255,255,255,0.07);
  --border-hi:  rgba(255,255,255,0.14);
  --text:       #e2e4eb;
  --text-muted: #5a6070;
  --text-dim:   #8b92a5;
  --green:      #34d48a;
  --green-dim:  rgba(52,212,138,0.15);
  --red:        #f05b6e;
  --red-dim:    rgba(240,91,110,0.15);
  --amber:      #f0a04b;
  --amber-dim:  rgba(240,160,75,0.12);
  --blue:       #5b8af0;
  --blue-dim:   rgba(91,138,240,0.12);
  --accent:     #5b8af0;
}

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: 'Tajawal', sans-serif;
  background: var(--bg-deep);
  color: var(--text);
  display: flex;
  flex-direction: column;
}

/* ── TITLEBAR ── */
.titlebar {
  height: 38px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  -webkit-app-region: drag;
  flex-shrink: 0;
  gap: 10px;
}

.titlebar-dot {
  width: 11px; height: 11px;
  border-radius: 50%;
  -webkit-app-region: no-drag;
}
.titlebar-dot.close  { background: #ff5f57; }
.titlebar-dot.min    { background: #febc2e; }
.titlebar-dot.max    { background: #28c840; }

.titlebar-title {
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: 0.05em;
  margin-right: auto;
  font-family: 'IBM Plex Mono', monospace;
}

/* ── LAYOUT ── */
.layout {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── SIDEBAR ── */
.sidebar {
  width: 230px;
  background: var(--bg-panel);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
}

.sidebar-header {
  padding: 14px 14px 10px;
  border-bottom: 1px solid var(--border);
}

.sidebar-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-muted);
  margin-bottom: 10px;
  font-family: 'IBM Plex Mono', monospace;
}

.btn-add {
  width: 100%;
  background: var(--bg-hover);
  border: 1px solid var(--border-hi);
  color: var(--text);
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-family: 'Tajawal', sans-serif;
  display: flex;
  align-items: center;
  gap: 7px;
  transition: background 0.15s, border-color 0.15s;
}

.btn-add:hover {
  background: var(--bg-card);
  border-color: var(--accent);
}

.btn-add .plus {
  font-size: 16px;
  color: var(--accent);
  line-height: 1;
}

/* SIDEBAR SEARCH */
.sidebar-search {
  width: 100%;
  margin-top: 8px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 8px;
  padding: 7px 10px;
  font-size: 12px;
  font-family: 'Tajawal', sans-serif;
  outline: none;
  transition: border-color 0.15s, color 0.15s;
}

.sidebar-search:focus {
  border-color: var(--accent);
  color: var(--text);
}

/* GROUP HEADERS */
.group-header {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  font-family: 'IBM Plex Mono', monospace;
  padding: 10px 10px 4px;
}

.sidebar-empty {
  text-align: center;
  color: var(--text-muted);
  padding: 20px 0;
}

.project-item.dragging {
  opacity: 0.4;
  border-color: var(--accent);
}

/* PROJECT LIST */
.project-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.project-list::-webkit-scrollbar { width: 4px; }
.project-list::-webkit-scrollbar-track { background: transparent; }
.project-list::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 2px; }

.project-item {
  position: relative;
  padding: 9px 10px;
  border-radius: 8px;
  cursor: pointer;
  margin-bottom: 3px;
  display: flex;
  align-items: center;
  gap: 9px;
  transition: background 0.12s;
  border: 1px solid transparent;
}

.project-item:hover {
  background: var(--bg-hover);
  border-color: var(--border);
}

.project-item.active {
  background: var(--bg-card);
  border-color: var(--border-hi);
}

.project-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--text-muted);
  flex-shrink: 0;
  transition: background 0.2s;
}

.project-dot.running  { background: var(--green); box-shadow: 0 0 6px var(--green); }
.project-dot.stopped  { background: var(--text-muted); }
.project-dot.booting  { background: var(--amber); animation: pulse 1s infinite; }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.project-name {
  font-size: 13px;
  color: var(--text-dim);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  transition: color 0.12s;
}

.project-item.active .project-name,
.project-item:hover .project-name {
  color: var(--text);
}

.project-delete {
  display: none;
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 15px;
  line-height: 1;
  padding: 2px 4px;
  border-radius: 4px;
  transition: color 0.12s, background 0.12s;
}

.project-item:hover .project-delete {
  display: flex;
}

.project-delete:hover {
  color: var(--red);
  background: var(--red-dim);
}

/* ── MAIN ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg-deep);
}

/* ── PROJECT HEADER ── */
.project-header {
  padding: 18px 22px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.project-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
}

.project-meta {
  font-size: 11px;
  color: var(--text-muted);
  font-family: 'IBM Plex Mono', monospace;
  margin-top: 3px;
}

/* STATUS BADGE */
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-family: 'IBM Plex Mono', monospace;
  border: 1px solid transparent;
  transition: all 0.2s;
}

.status-badge.running {
  background: var(--green-dim);
  color: var(--green);
  border-color: rgba(52,212,138,0.25);
}

.status-badge.stopped {
  background: rgba(255,255,255,0.04);
  color: var(--text-muted);
  border-color: var(--border);
}

.status-badge.booting {
  background: var(--amber-dim);
  color: var(--amber);
  border-color: rgba(240,160,75,0.25);
}

.status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
}

.status-badge.booting .status-dot {
  animation: pulse 1s infinite;
}

/* ── CONTROLS ── */
.controls {
  padding: 14px 22px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.ctrl-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-dim);
  cursor: pointer;
  font-size: 13px;
  font-family: 'Tajawal', sans-serif;
  transition: all 0.15s;
}

.ctrl-btn:hover { background: var(--bg-hover); border-color: var(--border-hi); color: var(--text); }
.ctrl-btn:active { transform: scale(0.97); }

.ctrl-btn.start:hover { border-color: var(--green); color: var(--green); background: var(--green-dim); }
.ctrl-btn.stop:hover  { border-color: var(--red);   color: var(--red);   background: var(--red-dim);   }
.ctrl-btn.restart:hover { border-color: var(--amber); color: var(--amber); background: var(--amber-dim); }
.ctrl-btn.open:hover  { border-color: var(--blue);  color: var(--blue);  background: var(--blue-dim);  }
.ctrl-btn.code:hover  { border-color: #7c7cf5; color: #9d9df5; background: rgba(124,124,245,0.12); }

.ctrl-btn.active {
  border-color: rgba(52,212,138,0.4);
  color: var(--green);
  background: var(--green-dim);
}

.ctrl-icon { font-size: 14px; }

/* PORT INPUT */
.port-input {
  width: 80px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 8px;
  padding: 7px 10px;
  font-size: 12px;
  font-family: 'IBM Plex Mono', monospace;
  outline: none;
  transition: border-color 0.15s, color 0.15s;
}

.port-input:focus {
  border-color: var(--accent);
  color: var(--text);
}

.port-input::-webkit-outer-spin-button,
.port-input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

/* PORT STATUS INDICATOR */
.port-status {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  padding: 6px 8px;
  border-radius: 6px;
  border: 1px solid transparent;
  align-self: center;
  min-width: 0;
  white-space: nowrap;
}

.port-status.free {
  color: var(--green);
  background: var(--green-dim);
  border-color: rgba(52,212,138,0.25);
}

.port-status.busy {
  color: var(--amber);
  background: var(--amber-dim);
  border-color: rgba(240,160,75,0.3);
}

.port-status.own {
  color: var(--blue);
  background: var(--blue-dim);
  border-color: rgba(91,138,240,0.25);
}

/* GROUP INPUT */
.group-input {
  width: 110px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 8px;
  padding: 7px 10px;
  font-size: 12px;
  font-family: 'Tajawal', sans-serif;
  outline: none;
  transition: border-color 0.15s, color 0.15s;
}

.group-input:focus {
  border-color: var(--accent);
  color: var(--text);
}

/* STDIN INPUT ROW */
.stdin-row {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  flex-shrink: 0;
}

.stdin-input {
  flex: 1;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 12px;
  font-family: 'IBM Plex Mono', monospace;
  outline: none;
  transition: border-color 0.15s, color 0.15s;
}

.stdin-input:focus {
  border-color: var(--accent);
  color: var(--text);
}

/* ── LOG AREA ── */
.log-wrapper {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding: 14px 22px;
}

.log-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.log-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-muted);
  font-family: 'IBM Plex Mono', monospace;
}

.log-clear {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 3px 9px;
  border-radius: 5px;
  font-size: 11px;
  cursor: pointer;
  font-family: 'IBM Plex Mono', monospace;
  transition: all 0.12s;
}

.log-clear:hover {
  border-color: var(--border-hi);
  color: var(--text-dim);
}

.logs {
  flex: 1;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow-y: auto;
  padding: 12px 14px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  line-height: 1.7;
  color: var(--text-muted);
}

.logs::-webkit-scrollbar { width: 4px; }
.logs::-webkit-scrollbar-track { background: transparent; }
.logs::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 2px; }

.log-line { display: block; }
.log-line.error { color: var(--red); }
.log-line.warn  { color: var(--amber); }
.log-line.system { color: var(--blue); }

/* LANG BUTTON */
.lang-btn {
  -webkit-app-region: no-drag;
  background: var(--bg-hover);
  border: 1px solid var(--border-hi);
  color: var(--text-dim);
  border-radius: 6px;
  font-size: 11px;
  padding: 3px 10px;
  cursor: pointer;
  font-family: 'IBM Plex Mono', monospace;
  transition: all 0.12s;
}

.lang-btn:hover {
  color: var(--text);
  border-color: var(--accent);
}

/* HEADER METRICS */
.header-side {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-metric {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
  min-width: 0;
}

/* LOG SEARCH */
.log-search {
  flex: 1;
  max-width: 240px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 12px;
  font-family: 'Tajawal', sans-serif;
  outline: none;
  transition: border-color 0.15s, color 0.15s;
}

.log-search:focus {
  border-color: var(--accent);
  color: var(--text);
}

.log-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* LTR OVERRIDES */
[dir="ltr"] .sidebar {
  border-left: none;
  border-right: 1px solid var(--border);
}

[dir="ltr"] .titlebar-title {
  margin-right: 0;
  margin-left: auto;
}

/* EMPTY STATE */
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  gap: 10px;
}

.empty-icon { font-size: 40px; opacity: 0.3; }
.empty-text { font-size: 14px; }

</style>
</head>
<body>

<!-- TITLEBAR -->
<div class="titlebar">
  <div class="titlebar-dot close"  onclick="window.api.closeApp()"></div>
  <div class="titlebar-dot min"    onclick="window.api.minimizeApp()"></div>
  <div class="titlebar-dot max"    onclick="window.api.maximizeApp()"></div>
  <div class="titlebar-title">local-dev-manager</div>
  <button class="lang-btn" id="lang-btn">ع</button>
</div>

<!-- LAYOUT -->
<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-label" data-i18n="projects">Projects</div>
      <button class="btn-add" onclick="window.api.addProject()">
        <span class="plus">+</span>
        <span data-i18n="addProject">Add Project</span>
      </button>
      <input type="text" class="sidebar-search" id="sidebar-search"
             data-i18n-ph="searchProjectsPh" placeholder="Search projects...">
    </div>
    <div class="project-list" id="sidebar"></div>
  </div>

  <!-- MAIN -->
  <div class="main" id="main-content">

    <!-- EMPTY STATE -->
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">⚙️</div>
      <div class="empty-text" data-i18n="emptyState">اختر مشروعًا أو أضف مشروعًا جديدًا</div>
    </div>

    <!-- PROJECT VIEW (hidden until project selected) -->
    <div id="project-view" style="display:none; flex:1; flex-direction:column; overflow:hidden;">

      <!-- HEADER -->
      <div class="project-header">
        <div class="project-info">
          <div class="project-title" id="project-title">---</div>
          <div class="project-meta" id="project-meta"></div>
        </div>
        <div class="header-side">
          <span class="header-metric" id="project-stats"></span>
          <span class="header-metric" id="uptime"></span>
          <div class="status-badge stopped" id="project-status">
            <span class="status-dot"></span>
            <span id="status-text">Stopped</span>
          </div>
        </div>
      </div>

      <!-- CONTROLS -->
      <div class="controls">
        <button class="ctrl-btn start"   onclick="window.api.start(currentProject)">
          <span class="ctrl-icon">▶</span> <span data-i18n="start">تشغيل</span>
        </button>
        <button class="ctrl-btn stop"    onclick="window.api.stop(currentProject)">
          <span class="ctrl-icon">■</span> <span data-i18n="stop">إيقاف</span>
        </button>
        <button class="ctrl-btn restart" onclick="window.api.restart(currentProject)">
          <span class="ctrl-icon">↺</span> <span data-i18n="restart">إعادة تشغيل</span>
        </button>
        <button class="ctrl-btn open"    onclick="openProject(currentProject)">
          <span class="ctrl-icon">↗</span> <span data-i18n="open">فتح</span>
        </button>
        <button class="ctrl-btn code"    onclick="window.api.openInCode(currentProject)">
          <span class="ctrl-icon">&lt;/&gt;</span> VS Code
        </button>
        <button class="ctrl-btn folder"  onclick="window.api.openFolder(currentProject)">
          <span class="ctrl-icon">📂</span> <span data-i18n="folder">مجلد</span>
        </button>
        <input type="number" class="port-input" id="port-input" min="1" max="65535"
               data-i18n-title="portTitle" title="Assigned port — Enter to save" placeholder="port">
        <span class="port-status" id="port-status" title=""></span>
        <input type="text" class="group-input" id="group-input"
               data-i18n-ph="groupPh" placeholder="Group">
        <button class="ctrl-btn" id="autostart-btn" onclick="window.api.toggleAutoStart(currentProject)">
          <span class="ctrl-icon">⏻</span> <span data-i18n="auto">تلقائي</span>
        </button>
        <button class="ctrl-btn" id="autorestart-btn" onclick="window.api.toggleAutoRestart(currentProject)">
          <span class="ctrl-icon">↻</span> <span data-i18n="autoRestart">إعادة تلقائية</span>
        </button>
      </div>

      <!-- LOGS -->
      <div class="log-wrapper">
        <div class="log-header">
          <div class="log-label" data-i18n="consoleOutput">Console Output</div>
          <div class="log-actions">
            <input type="text" class="log-search" id="log-search" data-i18n-ph="searchPh" placeholder="بحث في السجلات...">
            <button class="log-clear" onclick="exportLogs()" data-i18n="export">تصدير</button>
            <button class="log-clear" onclick="clearLogs()" data-i18n="clear">مسح</button>
          </div>
        </div>
        <div class="logs" id="logs"></div>
        <div class="stdin-row">
          <input type="text" class="stdin-input" id="stdin-input"
                 data-i18n-ph="stdinPh" placeholder="Interactive input for the project — Enter to send">
          <button class="log-clear" id="stdin-send" data-i18n="stdinSend">Send</button>
        </div>
      </div>

    </div>

  </div>

</div>

<script src="renderer.js"></script>

</body>
</html>
