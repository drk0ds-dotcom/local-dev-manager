<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Local Dev Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- TITLEBAR -->
<div class="titlebar">
  <button type="button" class="titlebar-dot close" id="app-close" data-i18n-aria="closeWindow" aria-label="Close window"></button>
  <button type="button" class="titlebar-dot min" id="app-minimize" data-i18n-aria="minimizeWindow" aria-label="Minimize window"></button>
  <button type="button" class="titlebar-dot max" id="app-maximize" data-i18n-aria="maximizeWindow" aria-label="Maximize window"></button>
  <div class="titlebar-title">local-dev-manager</div>
  <button class="lang-btn" id="lang-btn" data-i18n-aria="switchLanguage" aria-label="Switch to Arabic">ع</button>
</div>

<!-- LAYOUT -->
<div class="layout">

  <!-- SIDEBAR -->
  <nav class="sidebar" data-i18n-aria="projects" aria-label="Projects">
    <div class="sidebar-header">
      <div class="sidebar-label" data-i18n="projects">Projects</div>
      <button class="btn-add" id="add-project">
        <span class="plus">+</span>
        <span data-i18n="addProject">Add Project</span>
      </button>
      <input type="text" class="sidebar-search" id="sidebar-search"
             data-i18n-ph="searchProjectsPh" data-i18n-aria="searchProjectsPh" aria-label="Search projects" placeholder="Search projects...">
    </div>
    <div class="project-list" id="sidebar"></div>
  </nav>

  <!-- MAIN -->
  <main class="main" id="main-content">

    <!-- EMPTY STATE -->
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">⚙️</div>
      <div class="empty-text" data-i18n="emptyState">اختر مشروعًا أو أضف مشروعًا جديدًا</div>
    </div>

    <!-- PROJECT VIEW (hidden until project selected) -->
    <div id="project-view">

      <!-- HEADER -->
      <div class="project-header">
        <div class="project-info">
          <div class="project-title" id="project-title">---</div>
          <div class="project-meta" id="project-meta"></div>
        </div>
        <div class="header-side">
          <span class="header-metric" id="project-stats"></span>
          <span class="header-metric" id="uptime"></span>
          <div class="status-badge stopped" id="project-status" role="status" aria-live="polite">
            <span class="status-dot"></span>
            <span id="status-text">Stopped</span>
          </div>
        </div>
      </div>

      <!-- CONTROLS -->
      <div class="controls">
        <button class="ctrl-btn start" id="project-start">
          <span class="ctrl-icon">▶</span> <span data-i18n="start">تشغيل</span>
        </button>
        <button class="ctrl-btn stop" id="project-stop">
          <span class="ctrl-icon">■</span> <span data-i18n="stop">إيقاف</span>
        </button>
        <button class="ctrl-btn restart" id="project-restart">
          <span class="ctrl-icon">↺</span> <span data-i18n="restart">إعادة تشغيل</span>
        </button>
        <button class="ctrl-btn open" id="project-open">
          <span class="ctrl-icon">↗</span> <span data-i18n="open">فتح</span>
        </button>
        <button class="ctrl-btn code" id="project-code">
          <span class="ctrl-icon">&lt;/&gt;</span> VS Code
        </button>
        <button class="ctrl-btn folder" id="project-folder">
          <span class="ctrl-icon">📂</span> <span data-i18n="folder">مجلد</span>
        </button>
        <input type="number" class="port-input" id="port-input" min="1" max="65535"
               data-i18n-title="portTitle" data-i18n-aria="portTitle" aria-label="Assigned port" title="Assigned port — Enter to save" placeholder="port">
        <span class="port-status" id="port-status" title=""></span>
        <input type="text" class="group-input" id="group-input"
               data-i18n-ph="groupPh" data-i18n-aria="groupPh" aria-label="Group" placeholder="Group">
        <button class="ctrl-btn" id="autostart-btn">
          <span class="ctrl-icon"><svg class="auto-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 2v10"/><path d="M6.3 5.7a8 8 0 1 0 11.4 0"/></svg></span> <span data-i18n="auto">تلقائي</span>
        </button>
        <button class="ctrl-btn" id="autorestart-btn">
          <span class="ctrl-icon">↻</span> <span data-i18n="autoRestart">إعادة تلقائية</span>
        </button>
      </div>

      <div class="custom-command-row" id="custom-command-row" hidden>
        <label for="custom-command-input" data-i18n="commandLabel">Command</label>
        <input id="custom-command-input" type="text" maxlength="2048" autocomplete="off">
        <button id="custom-command-save" data-i18n="saveCommand">Save command</button>
        <span id="custom-command-help" data-i18n="commandNextStart">Changes take effect on the next start.</span>
        <span id="custom-command-error" role="alert"></span>
      </div>

      <!-- LOGS -->
      <div class="log-wrapper">
        <div class="log-header">
          <div class="log-label" data-i18n="consoleOutput">Console Output</div>
          <div class="log-actions">
            <input type="text" class="log-search" id="log-search" data-i18n-ph="searchPh" data-i18n-aria="searchPh" aria-label="Search logs" placeholder="بحث في السجلات...">
            <button id="log-export" class="log-clear" data-i18n="export">تصدير</button>
            <button id="log-clear" class="log-clear" data-i18n="clear">مسح</button>
          </div>
        </div>
        <div class="logs" id="logs" role="log" aria-live="polite" data-i18n-aria="consoleOutput" aria-label="Console Output"></div>
        <div class="stdin-row">
          <input type="text" class="stdin-input" id="stdin-input"
                 data-i18n-ph="stdinPh" data-i18n-aria="stdinPh" aria-label="Interactive input for the project" placeholder="Interactive input for the project — Enter to send">
          <button class="log-clear" id="stdin-send" data-i18n="stdinSend">Send</button>
        </div>
      </div>

    </div>

  </main>

</div>

<dialog id="add-project-dialog" class="project-dialog" aria-labelledby="new-project-title">
  <form id="new-project-form">
    <h2 id="new-project-title" data-i18n="configureProject">Configure project</h2>
    <p id="new-project-path" class="project-dialog-path"></p>
    <label for="new-project-mode" data-i18n="projectMode">Project type</label>
    <select id="new-project-mode">
      <option value="node" data-i18n="nodeScript">Node.js script</option>
      <option value="custom" data-i18n="customCommand">Custom command</option>
    </select>
    <div id="new-command-row">
      <label for="new-custom-command" data-i18n="commandLabel">Command</label>
      <input id="new-custom-command" type="text" maxlength="2048" autocomplete="off" placeholder="python worker.py">
    </div>
    <label for="new-project-port" data-i18n="optionalPort">Port (optional for custom commands)</label>
    <input id="new-project-port" type="number" min="1" max="65535" inputmode="numeric">
    <p id="new-project-warning" class="project-dialog-warning" data-i18n="commandWarning">Custom commands run locally with your Windows account's permissions. Only enter commands you trust.</p>
    <p id="new-project-error" class="project-dialog-error" role="alert"></p>
    <div class="project-dialog-actions">
      <button type="button" id="new-project-cancel" data-i18n="cancel">Cancel</button>
      <button type="submit" id="new-project-save" data-i18n="saveProject">Add project</button>
    </div>
  </form>
</dialog>

<script src="renderer.js"></script>

</body>
</html>
